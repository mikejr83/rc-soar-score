name: Release Windows alpha

# Builds the offline contest app for Windows when a GitHub release is published
# (for example tag `v0.1.0-alpha.1`, created in the GitHub UI) and attaches the
# zip to that release. Manual runs build the folder and upload it as a workflow
# artifact only, as a dry run. The Deploy workflow starts on the same event.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as, without the leading v (for example 0.1.0-alpha.1)"
        required: true
        default: "0.0.0-dryrun"

env:
  FLUTTER_VERSION: 3.47.x
  MELOS_VERSION: ^8.9.0
  # Baked into the app at build time; without it the app falls back to localhost.
  API_URL: https://api.rcsoarscore.com

jobs:
  windows-zip:
    name: Windows zip
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $full = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $full = '${{ inputs.version }}'
          }
          # The Windows file version is numeric, so the build name drops any
          # pre-release suffix; the zip and the release keep the full tag.
          $core = $full -replace '[-+].*$', ''
          "full=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "core=$core" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos "$env:MELOS_VERSION"

      - name: Bootstrap
        run: melos bootstrap

      - name: Install native dependencies for auth0_flutter
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --recurse "cpp-httplib[core,openssl]:x64-windows" nlohmann-json:x64-windows openssl:x64-windows

      - name: Build Windows
        working-directory: apps/soar_score_contest
        run: >
          flutter build windows --release --no-pub
          --dart-define=SOAR_SCORE_API_BASE_URL=${{ env.API_URL }}
          --build-name ${{ steps.version.outputs.core }}
          --build-number ${{ github.run_number }}

      # Notices for the offline app, from the generator that also feeds the
      # public /open-source page. Flags are those of scripts/generate_licences.dart.
      - name: Install web dependencies for the notices generator
        working-directory: apps/soar_score_web
        run: npm ci

      - name: Generate third-party notices
        run: >
          dart scripts/generate_licences.dart
          --product contest-app --notices THIRD_PARTY_NOTICES.txt

      - name: Package the zip
        shell: pwsh
        run: |
          $name = "soar-score-contest-windows-${{ steps.version.outputs.full }}"
          $release = "apps/soar_score_contest/build/windows/x64/runner/Release"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "$release/*" $stage -Recurse
          (Get-Content docs/alpha-readme.txt -Raw).Replace('{{VERSION}}', '${{ steps.version.outputs.full }}') |
            Set-Content "$stage/README.txt"
          if (-not (Test-Path THIRD_PARTY_NOTICES.txt)) { throw 'THIRD_PARTY_NOTICES.txt was not generated' }
          Copy-Item THIRD_PARTY_NOTICES.txt "$stage/THIRD_PARTY_NOTICES.txt"
          Compress-Archive -Path "stage/$name" -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Only dry runs need this: a tag run attaches the zip to the release
      # below. The artifact is the unzipped folder, because GitHub zips every
      # artifact itself and a zip would arrive zipped twice.
      - name: Keep the build as a workflow artifact (dry runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: stage/${{ env.ZIP_NAME }}

      - name: Attach the zip to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The release already exists (it triggered this run), so only upload.
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
