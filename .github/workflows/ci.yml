name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - name: Install NX dependencies
        run: npm ci
      - name: Install Flutter dependencies
        run: npx nx run-many --target=pub-get --all
      - name: Analyze all projects
        run: npx nx run-many --target=analyze --all --parallel=3
      - name: Test all projects
        run: npx nx run-many --target=test --all --parallel=3
      - name: Build all projects
        run: npx nx run-many --target=build --all --parallel=1