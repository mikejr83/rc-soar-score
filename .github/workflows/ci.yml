name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Toolchain pins: plan/tickets/mvp-implementation/001-setup-toolchain-baseline.md
# is the source of truth. Update that ticket first, then these values.
env:
  FLUTTER_VERSION: 3.47.x
  MELOS_VERSION: ^8.9.0

jobs:
  analyze-test-build:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos "$MELOS_VERSION"

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos analyze

      - name: Test
        run: melos test

      - name: Data package tests against PostgreSQL
        # Spin up a throwaway postgres:17 container, run the data package
        # suite against it (SQLite + PostgreSQL groups), then remove the
        # container even when the tests fail. Without POSTGRES_PASSWORD the
        # PostgreSQL group is skipped, which is not a pass.
        run: bash scripts/test-postgres.sh

      - name: Build
        run: melos run build

  build-windows:
    name: Build contest app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos "$env:MELOS_VERSION"

      - name: Bootstrap
        run: melos bootstrap

      - name: Build Windows
        working-directory: apps/soar_score_contest
        run: flutter build windows --no-pub

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test with docker compose
        # Starts the server and PostgreSQL and waits for both health checks,
        # so a healthy server answering /health proves the image runs.
        run: |
          docker compose up --build --wait --wait-timeout 300 -d
          curl --fail --silent --show-error http://localhost:8080/health

      - name: Show compose logs
        if: failure()
        run: docker compose logs

      - name: Stop compose
        if: always()
        run: docker compose down --volumes

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build, and push from master
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/soar_score_server/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
