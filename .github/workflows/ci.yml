name: CI

on:
  # Documentation-only changes skip the whole workflow. A push or PR runs
  # unless every changed file matches these patterns.
  push:
    branches: [master]
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".prettierrc"
      - ".prettierignore"
      - ".gitignore"
      - ".mcp.json"
      - ".agents/**"
      - ".kilo/**"
      - ".vscode/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".prettierrc"
      - ".prettierignore"
      - ".gitignore"
      - ".mcp.json"
      - ".agents/**"
      - ".kilo/**"
      - ".vscode/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Toolchain pins: plan/tickets/mvp-implementation/001-setup-toolchain-baseline.md
# is the source of truth. Update that ticket first, then these values.
env:
  FLUTTER_VERSION: 3.47.x
  MELOS_VERSION: ^8.9.0

jobs:
  # Cheap checks run first. The expensive jobs below wait for them, and any
  # failing job cancels the whole run (see the last step of each job).
  quick-checks:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos "$MELOS_VERSION"

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos format -o none --set-exit-if-changed -c 3

      - name: Analyze
        run: melos analyze --fatal-infos

      - name: Cancel the rest of the run
        # Fail fast: stop sibling jobs instead of letting them run to the end.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

  test:
    name: Test
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos "$MELOS_VERSION"

      - name: Bootstrap
        run: melos bootstrap

      - name: Test
        # Runs test/ in every project. The contest app's integration_test/
        # E2E journeys are not run here (they need the Windows desktop app);
        # run them locally with scripts/e2e.ps1.
        run: melos test -c 3

      - name: Data package and server slice tests against PostgreSQL
        # Spin up a throwaway postgres:17 container, run the data package
        # suite and the server's API slice tests against it (SQLite + PostgreSQL groups), then remove the
        # container even when the tests fail. Without POSTGRES_PASSWORD the
        # PostgreSQL group is skipped, which is not a pass.
        run: bash scripts/test-postgres.sh

      - name: Cancel the rest of the run
        # Fail fast: stop sibling jobs instead of letting them run to the end.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

  build:
    name: Build
    needs: quick-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos "$MELOS_VERSION"

      - name: Bootstrap
        run: melos bootstrap

      - name: Build
        run: |
          mkdir -p apps/soar_score_server/build/cli
          melos run build

      - name: Cancel the rest of the run
        # Fail fast: stop sibling jobs instead of letting them run to the end.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

  public-site-quick:
    name: Public site install and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: apps/soar_score_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/soar_score_web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Cancel the rest of the run
        # Fail fast: stop sibling jobs instead of letting them run to the end.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

  public-site:
    name: Public site test and build
    needs: public-site-quick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: apps/soar_score_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/soar_score_web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cancel the rest of the run
        # Fail fast: stop sibling jobs instead of letting them run to the end.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true

