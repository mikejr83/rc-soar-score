name: CI

on:
  # Documentation-only changes skip the whole workflow. A push or PR runs
  # unless every changed file matches these patterns.
  push:
    branches: [master]
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".prettierrc"
      - ".prettierignore"
      - ".gitignore"
      - ".mcp.json"
      - ".agents/**"
      - ".kilo/**"
      - ".vscode/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "plan/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".prettierrc"
      - ".prettierignore"
      - ".gitignore"
      - ".mcp.json"
      - ".agents/**"
      - ".kilo/**"
      - ".vscode/**"
      - ".github/CODEOWNERS"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Toolchain pins: plan/tickets/mvp-implementation/001-setup-toolchain-baseline.md
# is the source of truth. Update that ticket first, then these values.
env:
  FLUTTER_VERSION: 3.47.x
  MELOS_VERSION: ^8.9.0

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            windows:
              - "apps/soar_score_contest/**"
              - "packages/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - ".github/workflows/ci.yml"

  analyze-test-build:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: dart pub global activate melos "$MELOS_VERSION"

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos analyze

      - name: Test
        # Runs test/ in every project. The contest app's integration_test/
        # E2E journeys are not run here (they need the Windows desktop app);
        # run them locally with scripts/e2e.ps1.
        run: melos test

      - name: Data package tests against PostgreSQL
        # Spin up a throwaway postgres:17 container, run the data package
        # suite against it (SQLite + PostgreSQL groups), then remove the
        # container even when the tests fail. Without POSTGRES_PASSWORD the
        # PostgreSQL group is skipped, which is not a pass.
        run: bash scripts/test-postgres.sh

      - name: Build
        run: melos run build

  public-site:
    name: Public site (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/soar_score_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/soar_score_web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


