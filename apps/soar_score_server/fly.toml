# Fly.io configuration for the API server. Deploy from the repository root:
#
#   fly deploy --config apps/soar_score_server/fly.toml \
#     --dockerfile apps/soar_score_server/Dockerfile .
#
# See docs/deploy-api-fly.md. Secrets (DATABASE_URL) are never stored here;
# set them with `fly secrets set`.
app = "rc-soar-score-api"
primary_region = "iad"

[env]
  PORT = "8080"
  LOG_FORMAT = "json"
  LOG_LEVEL = "INFO"
  # Public identifiers, not secrets. The domain is the Auth0 custom domain
  # that issues the tokens (docs/auth0-setup.md).
  AUTH0_DOMAIN = "login.rcsoarscore.com"
  API_AUDIENCE = "https://soar-score.com/server"
  CORS_ALLOWED_ORIGINS = "https://app.rcsoarscore.com,https://score.rcsoarscore.com,https://rcsoarscore.com,https://www.rcsoarscore.com"

[http_service]
  internal_port = 8080
  force_https = true
  # Alpha: stop the machine when idle to keep the bill near zero. For the MVP
  # release set min_machines_running = 1 and auto_stop_machines = "off".
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
