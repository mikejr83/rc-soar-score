# Fly.io configuration for the API server. The Deploy workflow
# (.github/workflows/deploy.yml) runs this on every published GitHub release;
# by hand, from the repository root at the tag you want:
#
#   fly deploy --remote-only --ha=false --config apps/soar_score_server/fly.toml \
#     --dockerfile apps/soar_score_server/Dockerfile
#
# `--ha=false` stops a first deploy from creating spare machines; a deploy
# updates every machine the app already has, including the stopped burst
# machines (docs/deploy-api-fly.md, "Machines and bursts"). See
# docs/deploying.md. Secrets (DATABASE_URL) are never stored here; set them
# with `fly secrets set`.
app = "rc-soar-score-api"
primary_region = "iad"

[env]
  PORT = "8080"
  LOG_FORMAT = "json"
  LOG_LEVEL = "INFO"
  # Public identifiers, not secrets. The domain is the Auth0 custom domain
  # that issues the tokens (docs/auth0-setup.md).
  AUTH0_DOMAIN = "login.rcsoarscore.com"
  API_AUDIENCE = "https://soar-score.com/server"
  CORS_ALLOWED_ORIGINS = "https://app.rcsoarscore.com,https://score.rcsoarscore.com,https://rcsoarscore.com"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine is always on (no cold start). Extra machines, created stopped
  # with `fly machine clone`, are started by Fly's proxy when load passes the
  # soft limit below and stopped again when it falls, so a burst costs only the
  # hours they run. See docs/deploy-api-fly.md, "Machines and bursts".
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Each machine runs database statements one at a time over a single
  # connection, so start help early instead of letting requests queue.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 25

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
