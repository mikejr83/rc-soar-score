name: soar_score_data
resolution: workspace
description: "Unified Soar Score data access layer: repository implementations and migrations for both SQLite and PostgreSQL backends via the Drift QueryExecutor abstraction (pure Dart)."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  drift: ^2.35.0
  drift_postgres: ^1.3.1
  logging: ^1.3.0
  postgres: ^3.5.16
  soar_score_core:
    path: ../soar_score_core
  sqlite3: ^3.6.0
dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  lints: ^6.1.0
  test: ^1.31.1
