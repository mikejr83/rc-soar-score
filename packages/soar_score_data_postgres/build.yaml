# Configures drift_dev schema codegen for this package (ticket 016).
# Regenerate with: dart run build_runner build --delete-conflicting-outputs
targets:
  $default:
    builders:
      drift_dev:drift_dev:
        enabled: true
        options:
          # Generate code against the Postgres SQL dialect: this package's
          # tables are always executed through drift_postgres, never against
          # SQLite, so the generated DDL/queries target Postgres.
          sql:
            dialect: postgres
