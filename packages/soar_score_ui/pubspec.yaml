name: soar_score_ui
resolution: workspace
description: "Soar Score shared UI package: reusable Flutter widgets, composite components, and shared theme tokens for the contest and public apps."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  soar_score_core:
    path: ../soar_score_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Brand kit fonts and logos. Assets declared by a package are bundled into
# every app that depends on it; apps reach them through BrandFonts and
# BrandLogos, which carry the required `packages/soar_score_ui/` prefix.
flutter:
  assets:
    - assets/logos/
    - assets/logos/png/
    - assets/fonts/archivo/OFL.txt
    - assets/fonts/league_spartan/OFL.txt
    - assets/fonts/saira_stencil_one/OFL.txt
  fonts:
    - family: League Spartan
      fonts:
        - asset: assets/fonts/league_spartan/LeagueSpartan-Bold.ttf
          weight: 700
        - asset: assets/fonts/league_spartan/LeagueSpartan-ExtraBold.ttf
          weight: 800
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/archivo/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/archivo/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/archivo/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/archivo/Archivo-ExtraBold.ttf
          weight: 800
    - family: Saira Stencil One
      fonts:
        - asset: assets/fonts/saira_stencil_one/SairaStencilOne-Regular.ttf
          weight: 400
