name: soar_score_ui_storage
resolution: workspace
description: "Soar Score local UI storage (pure Dart): a typed, per-account key-value store for UI-only state, with in-memory, SQLite (native) and IndexedDB (web) backends."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  logging: ^1.3.0
  path: ^1.9.0
  sqlite3: ^3.6.0
  web: ^1.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
